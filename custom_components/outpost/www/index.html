<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outpost</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0c1016; color: #d6cfc4; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 28rem; margin: 0 auto; padding: 2.5rem 1.25rem; }
      h1 { font-weight: 500; letter-spacing: -0.03em; }
      p { line-height: 1.5; color: #9a9388; }
      code { color: #e8e0d4; }
    </style>
  </head>
  <body>
    <main>
      <p style="letter-spacing:0.18em;text-transform:uppercase;font-size:11px;color:#6f6a63">Outpost Colony</p>
      <h1>Set the Outpost URL</h1>
      <p>
        The 3D colony is your published Outpost page. In Home Assistant go to
        <strong>Settings → Devices &amp; services → Outpost Colony → Configure</strong>
        and paste that https address. The sidebar then loads your house with your
        existing login — no token.
      </p>
    </main>
  </body>
</html>
